
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOAMANI WEB | Dashboard</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101319;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:85px;
}
header{
 background:#15191f;
 padding:20px;
 text-align:center;
 border-bottom:1px solid #806326;
}
.logo{
 color:#e9b83f;
 font-size:28px;
 font-weight:bold;
 letter-spacing:2px;
}
small{color:#bba66f}
main{max-width:950px;margin:auto;padding:15px}
.gold-card{
 background:linear-gradient(125deg,#76551a,#30230e);
 border:1px solid #d4af37;
 padding:23px;
 border-radius:17px;
 margin-bottom:22px;
}
.balance{font-size:29px;font-weight:bold;margin:15px 0}
.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:11px;
}
.tile{
 background:#191d25;
 border:1px solid #514322;
 border-radius:12px;
 color:white;
 min-height:100px;
 padding:12px 5px;
 cursor:pointer;
}
.tile span{
 display:block;
 color:#e9b83f;
 font-size:28px;
 margin-bottom:10px;
}
.tile b{font-size:12px}
.panel{
 background:#191d25;
 border:1px solid #514322;
 border-radius:13px;
 padding:20px;
 margin-top:20px;
}
h2{color:#e9b83f;font-size:20px}
.btn{
 background:#d4af37;
 color:#151515;
 border:0;
 padding:12px 20px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}
input{
 width:100%;
 padding:12px;
 margin:8px 0;
 border-radius:8px;
 border:1px solid #806326;
 background:#101319;
 color:white;
}
label{display:block;margin-top:12px}
.notice{
 color:#e9c878;
 font-size:13px;
 line-height:1.8;
}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 width:100%;
 display:flex;
 justify-content:space-around;
 background:#15191f;
 border-top:1px solid #806326;
 padding:14px 5px;
}
.bottom button{
 background:none;
 border:0;
 color:#e9b83f;
 font-size:12px;
}
.hidden{display:none}
</style>
<script src="languages.js"></script>
</head>

<body>
<header>
<div class="logo">NOAMANI WEB</div>
<p data-i18n="welcome">NOAMANI WEB ته ښه راغلاست</p>
<small>Advertising • Investment • Earnings</small>
</header>


<div id="languageSwitcher" style="text-align:center;padding:12px">
<button class="btn" onclick="setLanguage('ps')">پښتو</button>
<button class="btn" onclick="setLanguage('fa')">دری</button>
<button class="btn" onclick="setLanguage('en')">English</button>
</div>

<main>
<div class="gold-card">
<small>NOAMANI PREMIUM ACCOUNT</small>
<div class="balance">0.00 AFN</div>
<small>Demo Balance • Not real money</small>
</div>

<section id="home">
<div class="grid" id="menu"></div>
</section>

<section class="panel hidden" id="detail">
<h2 id="pageTitle"></h2>
<p id="pageText"></p>
<div id="pageContent"></div>
<button class="btn" onclick="goHome()">بېرته کور ته</button>
</section>

</main>

<div class="bottom">
<button onclick="goHome()">⌂ Dashboard</button>
<button onclick="openPage(2)">▣ Wallet</button>
<button onclick="openPage(12)">☎ Support</button>
<button onclick="openPage(14)">♙ Profile</button>
</div>

<script>
const pages = [
  ["♙","Register","Registration section"],
  ["➜","Login","Account login section"],
  ["▣","Wallet","Personal account information"],
  ["◈","Investment","Mudarabah investment"],
  ["▤","Employee","Employee system"],
  ["◉","Advertising","Google AdSense section"],
  ["↓","Deposit","Deposit funds"],
  ["↑","Withdraw","Withdraw funds"],
  ["★","Rewards","Rewards for real activity"],
  ["♧","Referrals","Referral information"],
  ["◷","Transactions","Account history"],
  ["▦","Profit Calculator","Mudarabah calculator"],
  ["☎","Support","Support section"],
  ["⚙","Admin Panel","Administration section"],
  ["♙","Profile","Personal information"],
  ["ⓘ","About Us","About NOAMANI WEB"],
  ["☎","Contact Us","Contact and support information"],
  ["🔒","Privacy Policy","Privacy and data handling"],
  ["▤","Terms & Conditions","Website terms and conditions"]
];

const menu = document.getElementById("menu");
let currentPage = -1;
window.currentPage = currentPage;

pages.forEach((p, i) => {
  const btn = document.createElement("button");
  btn.className = "tile";
  const icon = document.createElement("span");
  icon.textContent = p[0];
  const name = document.createElement("b");
  name.textContent = p[1];
  btn.append(icon, name);
  btn.onclick = () => openPage(i);
  menu.appendChild(btn);
});

function goHome() {
  currentPage = -1;
  window.currentPage = -1;
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("detail").classList.add("hidden");
}

function openPage(i) {
  if (!Number.isInteger(i) || !pages[i]) return;
  currentPage = i;
  window.currentPage = i;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("detail").classList.remove("hidden");

  const lang = localStorage.getItem("noamani-language") || "ps";
  const t = translations[lang] || translations.ps;

  document.getElementById("pageTitle").textContent = t.menu[i];
  document.getElementById("pageText").textContent = t.descriptions[i];

  const content = document.getElementById("pageContent");
  content.replaceChildren();

  const legalKeys = {
    15: "about",
    16: "contact",
    17: "privacy",
    18: "terms"
  };

  if (i === 14) {
    renderProfile(t);
  } else if (i === 11) {
    renderCalculator(t);
  } else if (legalKeys[i] && t.legalPages && t.legalPages[legalKeys[i]]) {
    const paragraph = document.createElement("p");
    paragraph.className = "notice";
    paragraph.textContent = t.legalPages[legalKeys[i]][1];
    content.appendChild(paragraph);
  } else {
    const notice = document.createElement("p");
    notice.className = "notice";
    notice.textContent = t.notice;
    content.appendChild(notice);
  }
}


function renderProfile(t) {
  const content = document.getElementById("pageContent");
  const labels = t.profileLabels;

  content.replaceChildren();

  const card = document.createElement("div");
  card.className = "gold-card";

  const heading = document.createElement("h2");
  heading.textContent = "♙ " + labels.title;

  const nameLabel = document.createElement("label");
  nameLabel.textContent = labels.name;

  const nameInput = document.createElement("input");
  nameInput.id = "profileName";
  nameInput.maxLength = 60;
  nameInput.value = localStorage.getItem("noamani-profile-name") || "";

  const status = document.createElement("p");
  status.className = "notice";
  status.textContent = labels.status + ": " + labels.demo;

  const save = document.createElement("button");
  save.className = "btn";
  save.textContent = labels.save;

  const message = document.createElement("p");
  message.className = "notice";
  message.setAttribute("aria-live", "polite");

  save.onclick = () => {
    localStorage.setItem(
      "noamani-profile-name",
      nameInput.value.trim()
    );
    message.textContent = labels.saved;
  };

  card.append(
    heading,
    nameLabel,
    nameInput,
    status,
    save,
    message
  );

  content.appendChild(card);
}

function calculate() {
  const profitInput = document.getElementById("profit");
  const shareInput = document.getElementById("share");
  const out = document.getElementById("answer");
  if (!profitInput || !shareInput || !out) return;

  const p = profitInput.valueAsNumber;
  const s = shareInput.valueAsNumber;
  const lang = localStorage.getItem("noamani-language") || "ps";
  const t = translations[lang] || translations.ps;

  if (!Number.isFinite(p) || !Number.isFinite(s) ||
      p < 0 || s < 0 || s > 100) {
    out.textContent = t.invalid;
    return;
  }

  const investor = p * s / 100;
  const manager = p - investor;
  out.textContent =
    t.investor + ": " + investor.toFixed(2) +
    " AFN | " + t.manager + ": " + manager.toFixed(2) + " AFN";
}
</script>
</body>
</html>
